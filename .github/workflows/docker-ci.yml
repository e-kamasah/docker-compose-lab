
name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-compose-lab-web .

      - name: Start container
        run: docker run -d -p 8080:80 --name test-web docker-compose-lab-web

      - name: Inspect container status
        if: always()
        run: docker ps -a

      - name: Test Nginx inside container
        run: docker exec test-web wget -qO- http://127.0.0.1/

      - name: Test website from runner
        run: curl --verbose --fail http://127.0.0.1:8080/

      - name: Collect container logs
        if: always()
        run: docker logs test-web