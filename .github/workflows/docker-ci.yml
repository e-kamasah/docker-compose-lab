
name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-compose-lab-web .

      - name: Start container
        run: docker run -d -p 8080:80 --name test-web docker-compose-lab-web

        
      - name: Test website response
        run: curl --fail http://localhost:8080