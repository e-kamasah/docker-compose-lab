
name: Docker CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docker-compose-lab-web .

      - name: Start container
        run: docker run -d -p 8080:80 --name test-web docker-compose-lab-web

      - name: Inspect container logs
        if: always()
        run: docker logs test-web

      - name: Test website response
        run: curl --fail --retry 5 --retry-connrefused --retry-delay 2 http://localhost:8080